<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestro 25</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-night: #0B0D17;
            --bg-night-2: #12101f;
            --purple: #7c6fa8;
            --grape-off: #1E2A23;
            --grape-on: #A8E6CF;
            --text-light: #FDFBF7;
            --text-muted: #8A92A3;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse 120% 60% at 50% 0%, var(--bg-night-2) 0%, var(--bg-night) 55%, #060710 100%);
            color: var(--text-light);
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            position: relative;
        }
        #bg-stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .bgstar { position: absolute; background: var(--text-light); border-radius: 50%; opacity: .5; animation: tw 4s ease-in-out infinite; }
        @keyframes tw { 0%,100%{opacity:.15;transform:scale(.7)} 50%{opacity:.75;transform:scale(1.2)} }
        .mist { position: fixed; z-index:0; pointer-events:none; border-radius: 50%; filter: blur(60px); opacity: .3; }
        .mist.purple { background: var(--purple); width: 260px; height: 260px; top: -60px; left: -60px; }
        .mist.green { background: var(--grape-on); width: 220px; height: 220px; bottom: 10%; right: -60px; opacity: .12; }

        #app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; z-index: 1; }

        #hub {
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .eyebrow { font-size: .65rem; letter-spacing: 3px; text-transform: uppercase; color: var(--purple); margin-bottom: .6rem; font-weight: 700; }
        h1 { font-family:'Baloo 2', sans-serif; font-weight: 700; font-size: 1.8rem; margin-bottom: .6rem; color: var(--text-light); }
        .hub-sub { font-size: .85rem; color: var(--text-muted); margin-bottom: 3rem; }

        .grape-bunch { width: 200px; height: 250px; display: block; }
        .grape { fill: var(--grape-off); transition: all 0.5s ease; stroke: rgba(124,111,168,0.25); stroke-width: 1; }
        .grape.active {
            fill: var(--grape-on); cursor: pointer;
            filter: drop-shadow(0 0 15px rgba(168, 230, 207, 0.45));
            animation: pulse 3s infinite alternate; stroke: none;
        }
        @keyframes pulse {
            0% { filter: drop-shadow(0 0 10px rgba(168, 230, 207, 0.3)); transform: scale(1); transform-origin: center; }
            100% { filter: drop-shadow(0 0 20px rgba(168, 230, 207, 0.6)); transform: scale(1.03); transform-origin: center; }
        }
        .hub-hint { margin-top: 2.4rem; font-size: .7rem; color: var(--text-muted); letter-spacing: 1px; opacity: .7; }

        .counter-box { margin-top: 2.2rem; text-align: center; }
        .counter-label { font-size: .65rem; color: var(--purple); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: .8rem; font-weight: 700; }
        .counter-grid { display: flex; gap: 10px; justify-content: center; }
        .counter-cell {
            width: 58px; padding: .7rem 0; border-radius: 14px;
            background: rgba(168,230,207,0.06); border: 1px solid rgba(168,230,207,0.18);
            display: flex; flex-direction: column; align-items: center; gap: 2px;
        }
        .counter-cell span { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 1.15rem; color: var(--grape-on); }
        .counter-cell small { font-size: .58rem; color: var(--text-muted); letter-spacing: .5px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="bg-stars"></div>
    <div class="mist purple"></div>
    <div class="mist green"></div>

    <div id="app">
        <section id="hub">
            <div class="eyebrow">25 de cada mes 🍇</div>
            <h1>Nuestro 25</h1>
            <div class="hub-sub">9 meses siendo mi persona favorita ✨</div>

            <svg class="grape-bunch" viewBox="0 0 220 280">
                <path d="M110,40 Q110,10 130,5" stroke="var(--grape-off)" stroke-width="3" fill="none" stroke-linecap="round"/>
                <circle cx="60" cy="70" r="22" class="grape" />
                <circle cx="110" cy="60" r="22" class="grape" />
                <circle cx="160" cy="70" r="22" class="grape" />
                <circle cx="85" cy="110" r="22" class="grape" />
                <circle cx="135" cy="110" r="22" class="grape" />
                <circle cx="60" cy="150" r="22" class="grape" />
                <circle cx="110" cy="155" r="22" class="grape" />
                <circle cx="160" cy="150" r="22" class="grape" />
                <circle cx="110" cy="200" r="24" class="grape active" onclick="window.location.href='mes9/index.html'" />
            </svg>

            <div class="hub-hint">toca la uva brillante 👆</div>

            <div class="counter-box" id="counterBox">
                <div class="counter-label">contando desde el 25 de octubre</div>
                <div class="counter-grid">
                    <div class="counter-cell"><span id="cD">0</span><small>días</small></div>
                    <div class="counter-cell"><span id="cH">0</span><small>hrs</small></div>
                    <div class="counter-cell"><span id="cM">0</span><small>min</small></div>
                    <div class="counter-cell"><span id="cS">0</span><small>seg</small></div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const bgStars = document.getElementById('bg-stars');
        for (let i = 0; i < 50; i++) {
            const s = document.createElement('div');
            s.className = 'bgstar';
            const size = Math.random() * 2 + 1;
            s.style.width = size + 'px';
            s.style.height = size + 'px';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            s.style.animationDelay = (Math.random() * 4) + 's';
            bgStars.appendChild(s);
        }

        const startDate = new Date('2025-10-25T00:00:00');
        function updateCounter(){
            const now = new Date();
            let diff = now - startDate;
            if(diff < 0) diff = 0;
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff % 86400000) / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('cD').textContent = d;
            document.getElementById('cH').textContent = String(h).padStart(2,'0');
            document.getElementById('cM').textContent = String(m).padStart(2,'0');
            document.getElementById('cS').textContent = String(s).padStart(2,'0');
        }
        updateCounter();
        setInterval(updateCounter, 1000);
    </script>
</body>
</html>
