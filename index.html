<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nuestro 25 · faltan...</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-night: #0B0D17;
    --bg-night-2: #12101f;
    --purple: #7c6fa8;
    --grape-off: #1E2A23;
    --grape-on: #A8E6CF;
    --text-light: #FDFBF7;
    --text-muted: #8A92A3;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background: radial-gradient(ellipse 120% 60% at 50% 0%, var(--bg-night-2) 0%, var(--bg-night) 55%, #060710 100%);
    color: var(--text-light);
    font-family: 'Nunito', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
    position: relative;
    min-height: 100%;
  }

  #bg-stars{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  .bgstar{ position:absolute; background:var(--text-light); border-radius:50%; opacity:.5; animation: tw 4s ease-in-out infinite; }
  @keyframes tw{ 0%,100%{opacity:.15; transform:scale(.7)} 50%{opacity:.75; transform:scale(1.2)} }
  .mist{ position:fixed; z-index:0; pointer-events:none; border-radius:50%; filter:blur(60px); opacity:.3; }
  .mist.purple{ background:var(--purple); width:260px; height:260px; top:-60px; left:-60px; }
  .mist.green{ background:var(--grape-on); width:220px; height:220px; bottom:10%; right:-60px; opacity:.12; }

  #app{
    max-width:480px; margin:0 auto; min-height:100vh; position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 2rem 1.6rem; text-align:center;
  }

  .grape-mini{ width:70px; height:88px; display:block; margin-bottom:1.4rem; opacity:.9; }
  .grape-mini circle{ fill:var(--grape-off); stroke:rgba(124,111,168,.25); stroke-width:1; }
  .grape-mini circle.on{ fill:var(--grape-on); filter:drop-shadow(0 0 8px rgba(168,230,207,.5)); animation:pulseMini 3s infinite alternate; }
  @keyframes pulseMini{ 0%{opacity:.85} 100%{opacity:1} }

  .eyebrow{ font-size:.65rem; letter-spacing:3px; text-transform:uppercase; color:var(--purple); margin-bottom:.6rem; font-weight:700; }
  h1{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:1.5rem; margin-bottom:.5rem; }
  .sub{ font-size:.85rem; color:var(--text-muted); margin-bottom:2.4rem; line-height:1.6; }
  .sub b{ color:var(--grape-on); font-weight:700; }

  /* ---- contador ---- */
  #countdown-wrap{ width:100%; }
  .count-grid{ display:flex; gap:10px; justify-content:center; }
  .count-cell{
    flex:1; max-width:78px; padding: 1rem 0; border-radius:18px;
    background: rgba(168,230,207,.06); border:1px solid rgba(168,230,207,.18);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    position:relative; overflow:hidden;
  }
  .count-cell span{
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:1.7rem; color:var(--grape-on);
    line-height:1; transition: transform .25s ease;
  }
  .count-cell span.tick{ animation: tickPulse .4s ease; }
  @keyframes tickPulse{ 0%{ transform:scale(1.25); opacity:.4; } 100%{ transform:scale(1); opacity:1; } }
  .count-cell small{ font-size:.6rem; color:var(--text-muted); letter-spacing:1px; text-transform:uppercase; }

  .waiting-note{ margin-top:2rem; font-size:.72rem; color:var(--text-muted); letter-spacing:.5px; opacity:.75; line-height:1.6; }

  /* ---- estado desbloqueado ---- */
  #unlocked{ display:none; width:100%; flex-direction:column; align-items:center; }
  #unlocked.show{ display:flex; animation: fadeUp .8s ease; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(16px);} to{ opacity:1; transform:translateY(0);} }

  .unlock-icon{ font-size:2.4rem; margin-bottom:1rem; animation: floatIcon 3s ease-in-out infinite; }
  @keyframes floatIcon{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-8px);} }

  .enter-btn{
    margin-top: 1.8rem; padding: .95rem 2.2rem; border-radius:999px;
    background: linear-gradient(135deg, var(--grape-on), #6fae94);
    color:#0B0D17; font-family:'Baloo 2', sans-serif; font-weight:700; font-size:.95rem;
    border:none; cursor:pointer; letter-spacing:.5px;
    box-shadow: 0 0 30px rgba(168,230,207,.4);
    animation: btnGlow 2.4s ease-in-out infinite;
  }
  @keyframes btnGlow{ 0%,100%{ box-shadow:0 0 20px rgba(168,230,207,.35);} 50%{ box-shadow:0 0 34px rgba(168,230,207,.6);} }
  .enter-btn:active{ transform: scale(.96); }

  .sparkle{
    position:absolute; border-radius:50%; background:#fff; pointer-events:none;
    animation: sparkleUp 1.4s ease-out forwards;
  }
  @keyframes sparkleUp{
    0%{ opacity:1; transform: translateY(0) scale(1); }
    100%{ opacity:0; transform: translateY(-60px) scale(.3); }
  }
</style>
</head>
<body>

<div id="bg-stars"></div>
<div class="mist purple"></div>
<div class="mist green"></div>

<div id="app">

  <!-- ---- mientras se espera ---- -->
  <div id="waiting">
    <svg class="grape-mini" viewBox="0 0 100 130">
      <circle cx="30" cy="30" r="16" />
      <circle cx="70" cy="30" r="16" />
      <circle cx="50" cy="55" r="16" />
      <circle cx="30" cy="80" r="16" />
      <circle cx="70" cy="80" r="16" />
      <circle cx="50" cy="105" r="17" class="on" />
    </svg>

    <div class="eyebrow">25 de cada mes 🍇</div>
    <h1>todavía no es hora</h1>
    <div class="sub">esto se abre a la medianoche del 25,<br>hora de <b>México</b> — donde estás tú 🤍</div>

    <div id="countdown-wrap">
      <div class="count-grid">
        <div class="count-cell"><span id="cD">00</span><small>días</small></div>
        <div class="count-cell"><span id="cH">00</span><small>hrs</small></div>
        <div class="count-cell"><span id="cM">00</span><small>min</small></div>
        <div class="count-cell"><span id="cS">00</span><small>seg</small></div>
      </div>
    </div>

    <div class="waiting-note">se actualiza solo, no necesitas recargar la página 🕐</div>
  </div>

  <!-- ---- desbloqueado ---- -->
  <div id="unlocked">
    <div class="unlock-icon">🍇✨</div>
    <div class="eyebrow">ya es 25</div>
    <h1>feliz 25, morita</h1>
    <div class="sub">tu regalito de este mes ya está listo 🤍</div>
    <button class="enter-btn" onclick="goToMain()">entrar 🍇</button>
  </div>

</div>

<script>
  // ---- fondo de estrellas ----
  const bgStars = document.getElementById('bg-stars');
  for (let i = 0; i < 50; i++) {
    const s = document.createElement('div');
    s.className = 'bgstar';
    const size = Math.random() * 2 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 4) + 's';
    bgStars.appendChild(s);
  }

  // ---- link al html principal (ajusta si tu index.html está en otra ruta) ----
  const MAIN_PAGE_URL = 'hub.html';

  // ---- México (Ciudad de México) ya no tiene horario de verano: UTC-6 fijo ----
  const MEXICO_UTC_OFFSET_HOURS = -6;

function nextUnlockUTC() {
  return new Date(Date.now() + 10000); // SOLO PARA PROBAR — borrar después
}

  const waitingEl = document.getElementById('waiting');
  const unlockedEl = document.getElementById('unlocked');
  const cD = document.getElementById('cD');
  const cH = document.getElementById('cH');
  const cM = document.getElementById('cM');
  const cS = document.getElementById('cS');

  let target = nextUnlockUTC();
  let unlockedShown = false;
  let lastVals = { d:null, h:null, m:null, s:null };

  function tickAnimate(el, newVal, key) {
    if (lastVals[key] !== newVal) {
      el.textContent = newVal;
      el.classList.remove('tick');
      void el.offsetWidth;
      el.classList.add('tick');
      lastVals[key] = newVal;
    }
  }

  function updateCountdown() {
    const now = new Date();
    let diff = target.getTime() - now.getTime();

    if (diff <= 0) {
      if (!unlockedShown) {
        unlockedShown = true;
        waitingEl.style.display = 'none';
        unlockedEl.classList.add('show');
        launchSparkles();
      }
      return;
    }

    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);

    tickAnimate(cD, String(d).padStart(2, '0'), 'd');
    tickAnimate(cH, String(h).padStart(2, '0'), 'h');
    tickAnimate(cM, String(m).padStart(2, '0'), 'm');
    tickAnimate(cS, String(s).padStart(2, '0'), 's');
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  function goToMain() {
    document.body.style.transition = 'opacity .6s ease';
    document.body.style.opacity = '0';
    setTimeout(() => { window.location.href = MAIN_PAGE_URL; }, 550);
  }

  function launchSparkles() {
    const app = document.getElementById('app');
    for (let i = 0; i < 18; i++) {
      setTimeout(() => {
        const sp = document.createElement('div');
        sp.className = 'sparkle';
        const size = Math.random() * 4 + 2;
        sp.style.width = size + 'px';
        sp.style.height = size + 'px';
        sp.style.left = (Math.random() * 80 + 10) + '%';
        sp.style.top = (Math.random() * 60 + 20) + '%';
        sp.style.boxShadow = '0 0 8px 2px rgba(168,230,207,.6)';
        app.appendChild(sp);
        setTimeout(() => sp.remove(), 1500);
      }, i * 90);
    }
  }
</script>
</body>
</html>
